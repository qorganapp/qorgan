name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEPLOY_HOST: 77.240.38.74
  # Ключ хоста сервера: защищает деплой от подмены сервера (MITM).
  DEPLOY_KNOWN_HOST: "77.240.38.74 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIARQJxCkpjHFixW/D6xoA8cba60GxNpa8iCuIlWjukk+"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm exec eslint "{src,apps,libs,test}/**/*.ts"
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  images:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile
          - name: worker
            dockerfile: Dockerfile.worker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    # Деплои идут строго по очереди и не отменяют друг друга.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOST" > ~/.ssh/known_hosts
      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Ключ CI на сервере ограничен forced command (deploy/deploy.sh): только «backend <sha>».
        # Токен для скачивания образов уходит через stdin и живёт только до конца этой job.
        run: printf '%s' "$GHCR_TOKEN" | ssh -o StrictHostKeyChecking=yes deploy@"$DEPLOY_HOST" "backend ${{ github.sha }} ${{ github.actor }}"
