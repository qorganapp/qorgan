# Весь Qorgan одной командой: docker compose up --build → http://localhost:8080
# Наружу открыт только web, и только на 127.0.0.1; API доступен через него по /api.
name: qorgan

x-backend: &backend
  env_file: .env
  environment:
    DB_HOST: postgres
    REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-qorgan}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    <<: *backend
    build: { context: ., dockerfile: apps/api/Dockerfile }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    <<: *backend
    build: { context: ., dockerfile: apps/api/Dockerfile.worker }
    volumes: [trivycache:/cache/trivy]
    tmpfs: [/tmp:size=4g]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      # Схему базы создаёт API — воркер стартует после него.
      api: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ["127.0.0.1:${WEB_PORT:-8080}:8080"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  trivycache:
